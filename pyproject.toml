[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sow"
version = "0.1.0"
description = "Run-once seed and task files for SQLAlchemy and SQLModel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "greenlet",
    "sqlalchemy>=2",
    "typer>=0.12",
]

[project.optional-dependencies]
sqlmodel = ["sqlmodel>=0.0.22"]
aiosqlite = ["aiosqlite>=0.20"]
asyncpg = ["asyncpg>=0.29"]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
sow = "sow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
